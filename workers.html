<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小兵工作测试场</title><link rel="icon" href="/compass.svg"></head><body>
<canvas id="field" aria-label="小兵工作测试场。左键选人或框选，右键移动或采集。" tabindex="0"></canvas>
<header><div><small>UNIT SANDBOX / 05</small><h1>小兵工作测试场</h1></div><div class="stock" aria-label="仓库库存"><span>木材 <b id="wood">0</b></span><span>矿石 <b id="ore">0</b></span><span>果实 <b id="food">0</b></span></div><button id="pause">暂停</button><button id="reset">重置</button></header>
<nav id="view-tools" aria-label="视角控制"><button id="zoom-in" aria-label="放大视角">＋</button><button id="zoom-out" aria-label="缩小视角">−</button><button id="pan-mode" aria-pressed="false">平移</button><button id="view-reset">全景</button></nav><div id="hover-hint" hidden></div><div id="labels" aria-hidden="true"></div><div id="selection-box" hidden></div><div id="toast" role="status"></div>
<section id="panel"><div class="selection"><strong id="selected-title">已选中 1 号</strong><span id="detail">待命</span></div><div id="receipt" aria-live="polite"></div><div id="activity-summary" class="activity-summary" aria-label="人员状态"></div><div id="roster" class="roster" aria-label="选择小兵"></div><div class="unit-buttons"><button id="all">全选 12 人</button><button id="idle">选空闲</button><span class="split"></span><button data-group="1">第 1 组</button><button data-group="2">第 2 组</button><button data-group="3">第 3 组</button><span class="split"></span><button data-order="move">移动</button><button data-order="work">采集 / 砍伐</button><button id="deposit">送回仓库</button><button id="stop">停止</button></div><div class="jobs"><span>快捷派工</span><button id="auto-jobs">自动分工</button><button data-job="chop">伐木</button><button data-job="mine">采矿</button><button data-job="gather">采果</button><button data-job="pickup">搬货</button><span id="job-detail">选人后点击即可分配</span></div><div class="work-options"><button id="continue-job" aria-pressed="false">采空后续采：关</button><span id="continuation-hint">仅影响所选人员 · 后续命令优先</span><button id="workboard-toggle" aria-expanded="false">工作概览</button><button id="select-waiting">选等待</button></div><section id="workboard" hidden aria-label="工作概览"><div class="board-note">＋ 从空闲人员补一人 · − 撤回一人，有货先入库</div><div id="workboard-rows"></div></section><div id="orders" class="orders" hidden></div><div class="team-note">每组 4 人 · Ctrl + 1–3 保存编组，1–3 召回 · Shift + 下令追加任务</div><p id="hint">左键选中 / 拖框 · Shift 加选 · 右键地面移动，右键资源工作</p></section>
<aside>选人 → 右键目标，或使用底部快捷派工。<br>滚轮缩放 · 中键拖动 / 方向键平移 · Home 回全景</aside>
<script type="module" src="/src/workers/sandbox-main.ts"></script></body></html>
